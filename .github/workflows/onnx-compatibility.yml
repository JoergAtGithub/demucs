name: ONNX Cross-Platform & EP Compatibility

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  # =====================================================================
  # JOB 1: Build the ONNX model once & upload it as an artifact
  # =====================================================================
  build-onnx-model:
    name: Build htdemucs.onnx
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Export Dependencies
        run: |
          START=$(date +%s.%N)
          pip install --upgrade pip
          pip install torch torchaudio onnx onnxscript
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          END=$(date +%s.%N)
          echo "⏱️ Dependencies installed in: $(python -c "print(f'{${END} - ${START}:.2f}s')")"

      - name: Convert PyTorch to ONNX
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          START=$(date +%s.%N)
          mkdir -p ./onnx-models
          python ./scripts/convert-pth-to-onnx.py ./onnx-models
          END=$(date +%s.%N)
          echo "⏱️ Model conversion took: $(python -c "print(f'{${END} - ${START}:.2f}s')")"

      - name: Validate ONNX Structure & Shapes
        run: |
          python -c "
          import time, onnx
          t0 = time.perf_counter()
          model = onnx.load('./onnx-models/htdemucs.onnx')
          onnx.checker.check_model(model)
          print(f'✅ ONNX graph is valid! Duration: {time.perf_counter() - t0:.3f}s')
          "

      - name: Upload ONNX Artifact
        uses: actions/upload-artifact@v7
        with:
          name: htdemucs.onnx
          path: ./onnx-models/htdemucs.onnx
          retention-days: 1
          archive: false

  # =====================================================================
  # JOB 2: Multi-OS & Execution Provider Sequential Test Matrix
  # =====================================================================
  test-execution-providers:
    name: Test (${{ matrix.target_name }})
    needs: build-onnx-model
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux x64: OpenVINO (CPU -> GPU -> Intel NPUs) ---
          - target_name: "Linux x64 - OpenVINO (CPU -> GPU -> NPUs)"
            os: ubuntu-24.04
            pkg: "onnxruntime==1.24.1 onnxruntime-ep-openvino==1.8.1 openvino==2026.4.1"
            targets: |
              [
                {"name": "ORT CPU", "ep": "CPUExecutionProvider"},
                {"name": "OpenVINO CPU (Plugin EP)", "ep": "OpenVINOExecutionProvider", "options": {"device_type": "CPU"}, "plugin_ep": true, "plugin_verbose": true},
                {"name": "OpenVINO GPU", "ep": "OpenVINOExecutionProvider", "options": {"device_type": "GPU"}, "force_offline": true},
                {"name": "NPU 3720 (Meteor/Arrow Lake)", "ep": "OpenVINOExecutionProvider", "npu_platform": "3720", "compile_only": true},
                {"name": "NPU 5010 (Panther Lake)", "ep": "OpenVINOExecutionProvider", "npu_platform": "5010", "compile_only": true},
                {"name": "NPU 5020 (Wildcat Lake)", "ep": "OpenVINOExecutionProvider", "npu_platform": "5020", "compile_only": true, "optional_platform": true},
                {"name": "NPU 6010 (Nova Lake)", "ep": "OpenVINOExecutionProvider", "npu_platform": "6010", "compile_only": true}
              ]

          # --- Linux x64: NVIDIA CUDA + cuDNN + TensorRT ---
          - target_name: "Linux x64 - NVIDIA CUDA, cuDNN & TensorRT"
            os: ubuntu-latest
            install_nvidia_driver: true
            pkg: "'onnxruntime-gpu[cuda,cudnn]' nvidia-cublas tensorrt-cu13"
            targets: |
              [
                {"name": "ORT CPU (CUDA Build)", "ep": "CPUExecutionProvider"},
                {"name": "NVIDIA CUDA + cuDNN", "ep": "CUDAExecutionProvider", "options": {"cudnn_conv_algo_search": "EXHAUSTIVE"}, "allow_no_gpu_dry_run": true}
              ]

          # --- Linux ARM64: CPU -> XNNPACK ---
          - target_name: "Linux ARM64 - CPU -> XNNPACK"
            os: ubuntu-24.04-arm
            pkg: ""
            build_ort_xnnpack: true
            targets: |
              [
                {"name": "ORT CPU", "ep": "CPUExecutionProvider"},
                {"name": "XNNPACK (ARM NEON)", "ep": "XnnpackExecutionProvider"}
              ]

          # --- Windows 11 x64: OpenVINO (CPU -> GPU -> Intel NPUs) ---
          - target_name: "Windows x64 - OpenVINO (CPU -> GPU -> NPUs)"
            os: windows-latest
            pkg: "onnxruntime-openvino==1.24.1 openvino==2025.4.1"
            targets: |
              [
                {"name": "ORT CPU", "ep": "CPUExecutionProvider"},
                {"name": "OpenVINO CPU", "ep": "OpenVINOExecutionProvider", "options": {"device_type": "CPU"}},
                {"name": "OpenVINO GPU", "ep": "OpenVINOExecutionProvider", "options": {"device_type": "GPU"}, "skip_if_missing_hw": true},
                {"name": "NPU 3720 (Meteor/Arrow Lake)", "ep": "OpenVINOExecutionProvider", "npu_platform": "3720", "compile_only": true},
                {"name": "NPU 5010 (Panther Lake)", "ep": "OpenVINOExecutionProvider", "npu_platform": "5010", "compile_only": true},
                {"name": "NPU 5020 (Wildcat Lake)", "ep": "OpenVINOExecutionProvider", "npu_platform": "5020", "compile_only": true, "optional_platform": true},
                {"name": "NPU 6010 (Nova Lake)", "ep": "OpenVINOExecutionProvider", "npu_platform": "6010", "compile_only": true, "optional_platform": true}
              ]

          # --- Windows 11 x64: NVIDIA CUDA + cuDNN + TensorRT ---
          - target_name: "Windows x64 - NVIDIA CUDA, cuDNN & TensorRT"
            os: windows-latest
            pkg: "'onnxruntime-gpu[cuda,cudnn]' nvidia-cublas tensorrt-cu13"
            targets: |
              [
                {"name": "ORT CPU (CUDA Build)", "ep": "CPUExecutionProvider"},
                {"name": "NVIDIA CUDA + cuDNN", "ep": "CUDAExecutionProvider", "options": {"cudnn_conv_algo_search": "EXHAUSTIVE"}, "allow_no_gpu_dry_run": true}
              ]

          # --- Windows 11 x64: DirectML (CPU -> GPU/WARP) ---
          - target_name: "Windows x64 - DirectML (CPU -> GPU)"
            os: windows-latest
            pkg: "onnxruntime-directml"
            targets: |
              [
                {"name": "ORT CPU", "ep": "CPUExecutionProvider"},
                {"name": "DirectML (Offline Check)", "ep": "DmlExecutionProvider", "backend": "directml_offline"}
              ]

          # --- macOS Apple Silicon: CoreML (CPU -> GPU -> ALL/ANE) ---
          - target_name: "macOS Apple Silicon - CoreML (CPU -> GPU -> NPU)"
            os: macos-latest
            pkg: "onnxruntime"
            allow_skip: false
            targets: |
              [
                {"name": "ORT CPU", "ep": "CPUExecutionProvider"},
                {"name": "CoreML CPUOnly", "ep": "CoreMLExecutionProvider", "options": {"ModelFormat": "MLProgram", "MLComputeUnits": "CPUOnly"}},
                {"name": "CoreML CPUAndGPU", "ep": "CoreMLExecutionProvider", "options": {"ModelFormat": "MLProgram", "MLComputeUnits": "CPUAndGPU"}},
                {"name": "CoreML CPUAndNeuralEngine (NPU)", "ep": "CoreMLExecutionProvider", "options": {"ModelFormat": "MLProgram", "MLComputeUnits": "CPUAndNeuralEngine"}},
                {"name": "CoreML ALL (GPU+NPU)", "ep": "CoreMLExecutionProvider", "options": {"ModelFormat": "MLProgram", "MLComputeUnits": "ALL"}}
              ]

          # --- macOS Intel x64: CoreML (CPU -> GPU) ---
          - target_name: "macOS x64 - CoreML (CPU -> GPU)"
            os: macos-15-intel
            pkg: "onnxruntime"
            targets: |
              [
                {"name": "ORT CPU", "ep": "CPUExecutionProvider"},
                {"name": "CoreML CPUOnly", "ep": "CoreMLExecutionProvider", "options": {"ModelFormat": "MLProgram", "MLComputeUnits": "CPUOnly"}},
                {"name": "CoreML CPUAndGPU", "ep": "CoreMLExecutionProvider", "options": {"ModelFormat": "MLProgram", "MLComputeUnits": "CPUAndGPU"}}
              ]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download ONNX Model
        uses: actions/download-artifact@v8
        with:
          name: htdemucs.onnx
          path: ./onnx-models

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install NVIDIA Driver Libraries
        if: matrix.install_nvidia_driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnvidia-compute-580 || sudo apt-get install -y --no-install-recommends libnvidia-compute-570 || sudo apt-get install -y --no-install-recommends libnvidia-compute-550
          sudo ldconfig
          ldconfig -p | grep libcuda || true

      - name: Cache ONNX Runtime XNNPACK wheel
        if: matrix.build_ort_xnnpack
        id: ort-xnnpack-cache
        uses: actions/cache@v4
        with:
          path: ort-xnnpack-wheel
          key: ort-xnnpack-wheel-${{ runner.os }}-${{ runner.arch }}-v1.24.1-py3.11

      - name: Build ONNX Runtime with XNNPACK
        if: matrix.build_ort_xnnpack && steps.ort-xnnpack-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip numpy wheel packaging setuptools cmake
          git clone --depth 1 --branch v1.24.1 --recursive https://github.com/microsoft/onnxruntime.git ort-src
          cd ort-src
          ./build.sh --config Release --use_xnnpack --build_wheel --parallel --skip_tests --compile_no_warning_as_error --cmake_extra_defines CMAKE_POLICY_VERSION_MINIMUM=3.5
          mkdir -p ../ort-xnnpack-wheel
          cp build/Linux/Release/dist/*.whl ../ort-xnnpack-wheel/

      - name: Install ONNX Runtime XNNPACK wheel
        if: matrix.build_ort_xnnpack
        shell: bash
        run: pip install ort-xnnpack-wheel/*.whl

      - name: Install Runtime Package (${{ matrix.pkg }})
        shell: bash
        run: |
          START=$(python -c "import time; print(time.perf_counter())")
          python -m pip install --upgrade pip
          if [[ "${{ matrix.pkg }}" == *openvino* ]]; then
            pip install numpy onnx
          else
            pip install numpy onnx colored polygraphy --extra-index-url https://pypi.ngc.nvidia.com
          fi
          if [ -n "${{ matrix.pkg }}" ]; then pip install ${{ matrix.pkg }}; fi
          python -c "import time; print(f'⏱️ Runtime package installed in {time.perf_counter() - ${START}:.2f}s')"

      - name: Install matching OpenVINO NPU compiler
        if: runner.os == 'Linux' && contains(matrix.pkg, 'openvino')
        shell: bash
        run: |
          set -euo pipefail
          archive=npu_compiler_vcl_ubuntu_24_04-8_4_0-f45de31.tar.gz
          curl --fail --location --retry 3 -o "$archive" "https://storage.openvinotoolkit.org/dependencies/thirdparty/linux/npu_compiler/$archive"
          echo "27ed07ff346c49b8af4c916279d4beb361fde27c0cf290fcb3ca75f9963ab572  $archive" | sha256sum --check
          mkdir -p /tmp/openvino-npu-compiler
          tar -xzf "$archive" -C /tmp/openvino-npu-compiler
          OV_LIBS=$(python -c "import openvino, os; print(os.path.join(os.path.dirname(openvino.__file__), 'libs'))")
          install -m 755 /tmp/openvino-npu-compiler/lib/libopenvino_intel_npu_compiler.so "$OV_LIBS/"
          install -m 755 /tmp/openvino-npu-compiler/lib/libopenvino_intel_npu_compiler_loader.so "$OV_LIBS/"
          install -m 755 /tmp/openvino-npu-compiler/lib/libopenvino_intel_npu_vm_runtime.so "$OV_LIBS/"

      - name: Test OpenVINO compatibility checks
        if: runner.os == 'Linux' && contains(matrix.pkg, 'openvino')
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_onnx_ep_checks.py

      - name: Install and test macOS audio benchmark dependencies
        if: runner.os == 'macOS'
        run: |
          python -m pip install soundfile pytest
          python -m pytest -q tests/test_onnx_ep_checks.py

      - name: Report Linux OpenVINO host resources
        if: runner.os == 'Linux' && contains(matrix.pkg, 'onnxruntime-ep-openvino')
        shell: bash
        run: |
          uname -a
          lscpu
          free -h
          for file in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do
            if [ -r "$file" ]; then echo "$file:"; cat "$file"; fi
          done

      - name: Run Execution Provider Sequence
        shell: bash
        env:
          TEST_TARGETS: ${{ matrix.targets }}
          BENCHMARK_AUDIO: ${{ runner.os == 'macOS' && 'tests/trance_mainmix.wav' || '' }}
        run: |
          python -u ./scripts/test_onnx_ep.py ./onnx-models/htdemucs.onnx

  # =====================================================================
  # JOB 3: Offline Cross-Compilation for Multiple AMD GPU Architectures
  # =====================================================================
  test-migraphx-offline:
    name: Test (Linux x64 - AMD MIGraphX Multi-Arch AOT)
    needs: build-onnx-model
    runs-on: ubuntu-latest
    container:
      image: rocm/dev-ubuntu-24.04:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download ONNX Model
        uses: actions/download-artifact@v8
        with:
          name: htdemucs.onnx
          path: ./onnx-models

      - name: Install MIGraphX and Python Helpers in Container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg python3-pip
          mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor -o /etc/apt/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/latest noble main" > /etc/apt/sources.list.d/rocm-classic.list
          apt-get update
          apt-get install -y --no-install-recommends migraphx
          dpkg -L migraphx | grep -i 'bin/' || true
          python3 -m pip install --break-system-packages numpy onnx colored polygraphy onnxruntime --extra-index-url https://pypi.ngc.nvidia.com
          echo "$(dirname "$(ls /opt/rocm*/bin/migraphx-driver | tail -n 1)")" >> "$GITHUB_PATH"

      - name: Cross-Compile ONNX Graph for AMD GPU Architectures
        env:
          TEST_TARGETS: |
            [
              {"name": "AMD RDNA 2 (gfx1030 - RX 6000)", "backend": "migraphx_cli", "gfx_arch": "gfx1030"},
              {"name": "AMD RDNA 3 (gfx1100 - RX 7000)", "backend": "migraphx_cli", "gfx_arch": "gfx1100"},
              {"name": "AMD RDNA 3.5 (gfx1150 - Ryzen AI)", "backend": "migraphx_cli", "gfx_arch": "gfx1150", "optional_arch": true},
              {"name": "AMD RDNA 4 (gfx1201 - RX 9000)", "backend": "migraphx_cli", "gfx_arch": "gfx1201", "optional_arch": true},
              {"name": "AMD CDNA 2 (gfx90a - MI200)", "backend": "migraphx_cli", "gfx_arch": "gfx90a"}
            ]
        run: |
          python3 ./scripts/test_onnx_ep.py ./onnx-models/htdemucs.onnx
